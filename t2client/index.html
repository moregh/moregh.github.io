<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tradefind</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main class="shell">
      <section class="filters" aria-label="Result filters">
        <fieldset class="type-filters">
          <legend>Types</legend>
          <label class="check"><input class="type-filter" type="checkbox" value="Ship" checked> Ships</label>
          <label class="check"><input class="type-filter" type="checkbox" value="Drone" checked> Drones</label>
          <label class="check"><input class="type-filter" type="checkbox" value="Module" checked> Modules</label>
          <label class="check"><input class="type-filter" type="checkbox" value="Charge" checked> Ammo</label>
        </fieldset>

        <label class="search-filter">
          Search
          <input id="search" placeholder="Item or group">
        </label>

        <label class="hub-filter">
          Materials hub
          <select id="sourceHub">
            <option value="jita" selected>Jita 4-4</option>
            <option value="amarr">Amarr</option>
            <option value="dodixie">Dodixie</option>
            <option value="hek">Hek</option>
          </select>
        </label>

        <label class="hub-filter">
          Sales hub
          <select id="sellHub">
            <option value="jita" selected>Jita 4-4</option>
            <option value="amarr">Amarr</option>
            <option value="dodixie">Dodixie</option>
            <option value="hek">Hek</option>
          </select>
        </label>

        <div class="industry-filters">
          <label>
            Build system
            <input id="buildSystem" list="solarSystems" value="Jita">
            <input id="buildSystemId" type="hidden" value="30000142">
            <datalist id="solarSystems"></datalist>
          </label>
          <label>
            Build structure
            <select id="structureType">
              <option value="raitaru">Raitaru</option>
              <option value="azbel">Azbel</option>
              <option value="sotiyo">Sotiyo</option>
              <option value="astrahus">Astrahus</option>
              <option value="fortizar">Fortizar</option>
              <option value="keepstar">Keepstar</option>
              <option value="athanor">Athanor</option>
              <option value="tatara">Tatara</option>
              <option value="npc" selected>NPC</option>
              <option value="pos">POS</option>
            </select>
          </label>
          <label>
            Product Rig
            <select id="productRig">
              <option value="none" selected>No product rig</option>
              <option value="t1">T1 product rig</option>
              <option value="t2">T2 product rig</option>
            </select>
          </label>
          <label>
            Components Rig
            <select id="componentRig">
              <option value="none" selected>No components rig</option>
              <option value="t1">T1 components rig</option>
              <option value="t2">T2 components rig</option>
            </select>
          </label>
          <label>
            Invention decryptor
            <select id="decryptor">
              <option value="none" selected>No decryptor</option>
            </select>
          </label>
        </div>

        <div class="range-filters">
          <fieldset class="range-pair">
            <legend>Profit</legend>
            <input id="minProfit" type="number" step="100000" placeholder="Min">
            <input id="maxProfit" type="number" step="100000" placeholder="Max">
          </fieldset>
          <fieldset class="range-pair">
            <legend>Profit/m3</legend>
            <input id="minProfitM3" type="number" step="1000" placeholder="Min">
            <input id="maxProfitM3" type="number" step="1000" placeholder="Max">
          </fieldset>
          <fieldset class="range-pair">
            <legend>Daily volume</legend>
            <input id="minDailyVolume" type="number" min="0" step="1" placeholder="Min">
            <input id="maxDailyVolume" type="number" min="0" step="1" placeholder="Max">
          </fieldset>
          <fieldset class="range-pair">
            <legend>Sell orders</legend>
            <input id="minOrders" type="number" min="0" step="1" placeholder="Min">
            <input id="maxOrders" type="number" min="0" step="1" placeholder="Max">
          </fieldset>
          <fieldset class="range-pair">
            <legend>Build cost</legend>
            <input id="minCost" type="number" min="0" step="1000000" placeholder="Min">
            <input id="maxCost" type="number" min="0" step="1000000" placeholder="Max">
          </fieldset>
          <fieldset class="range-pair">
            <legend>Packaged m3</legend>
            <input id="minM3" type="number" min="0" step="1" placeholder="Min">
            <input id="maxM3" type="number" min="0" step="1" placeholder="Max">
          </fieldset>
        </div>
      </section>

      <section class="summary-bar">
        <div class="summary-grid" id="status">
          <span class="summary-card">Loading market data</span>
        </div>
      </section>

      <section class="table-wrap">
        <table>
          <colgroup>
            <col class="col-item">
            <col class="col-type">
            <col class="col-profit-m3">
            <col class="col-profit">
            <col class="col-margin">
            <col class="col-buy-profit">
            <col class="col-cost">
            <col class="col-sell">
            <col class="col-buy">
            <col class="col-buy-margin">
            <col class="col-daily">
            <col class="col-orders">
            <col class="col-listed">
            <col class="col-volume">
          </colgroup>
          <thead>
            <tr class="column-groups">
              <th colspan="2">Item</th>
              <th colspan="4">Profitability</th>
              <th colspan="4">Pricing</th>
              <th colspan="4">Market</th>
            </tr>
            <tr>
              <th><button class="sort" data-sort="name">Item</button></th>
              <th><button class="sort" data-sort="kind">Type</button></th>
              <th><button class="sort" data-sort="profitPerM3">ISK/m3</button></th>
              <th><button class="sort" data-sort="profit">Profit</button></th>
              <th><button class="sort" data-sort="margin">Sell %</button></th>
              <th><button class="sort" data-sort="profitToBuy">Buy profit</button></th>
              <th><button class="sort" data-sort="buildCost">Build cost</button></th>
              <th><button class="sort" data-sort="sellPrice">Sell price</button></th>
              <th><button class="sort" data-sort="buyPrice">Buy order</button></th>
              <th><button class="sort" data-sort="buyMargin">Buy %</button></th>
              <th><button class="sort" data-sort="dailyVolume">Daily sold</button></th>
              <th><button class="sort" data-sort="sellOrders">Sell orders</button></th>
              <th><button class="sort" data-sort="sellVolume">Listed qty</button></th>
              <th><button class="sort" data-sort="volume">Packaged m3</button></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="14" class="empty">Loading market analysis.</td></tr>
          </tbody>
        </table>
      </section>

      <section class="details" id="details"></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
